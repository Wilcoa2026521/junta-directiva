<script>
  // ============================================================
  // Reemplazo de window.storage (esa función solo existe dentro
  // de Claude.ai). Los datos COMPARTIDOS (shared=true: reservas,
  // config del salón) se guardan en Firebase Firestore, así todos
  // los aparatos ven lo mismo. Los datos PERSONALES de este
  // dispositivo (shared=false: sesión iniciada) se guardan en
  // localStorage, igual que antes.
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDFFESd5Dkat78ey5Ee8OOuN0iLvfbyemA",
    authDomain: "junta-directiva-546d9.firebaseapp.com",
    projectId: "junta-directiva-546d9",
    storageBucket: "junta-directiva-546d9.firebasestorage.app",
    messagingSenderId: "875787295537",
    appId: "1:875787295537:web:054cf661bc67f376bbae10",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ============================================================
  // Fotos de las reservas: en vez de Firebase Storage (que ahora
  // exige pasar al plan de pago Blaze aunque no se gaste nada),
  // cada foto se comprime en el propio celular y se guarda como
  // texto (base64) en un documento de Firestore, en la colección
  // aparte "wilcoa_fotos" (no se mezcla con el documento grande
  // de reservas, para no hacerlo pesado). Esto entra sin problema
  // dentro del plan gratis (Spark), sin tarjeta ni facturación.
  // ============================================================
  window.wilcoaSavePhoto = async function (reservationId, dataUrl, takenBy) {
    const ref = db.collection('wilcoa_fotos').doc();
    const photo = { id: ref.id, reservationId, dataUrl, takenBy: takenBy || '', takenAt: new Date().toISOString() };
    await ref.set(photo);
    return photo;
  };
  window.wilcoaDeletePhotoDoc = async function (photoId) {
    await db.collection('wilcoa_fotos').doc(photoId).delete();
  };
  // Avisa en tiempo real de las fotos de UNA reserva (sin importar
  // desde qué celular se tomaron), igual que ya hace storageWatch
  // con el resto de los datos compartidos.
  window.wilcoaWatchPhotos = function (reservationId, onChange, onError) {
    return db.collection('wilcoa_fotos').where('reservationId', '==', reservationId)
      .onSnapshot((snap) => {
        const photos = [];
        snap.forEach(doc => photos.push(doc.data()));
        onChange(photos);
      }, (err) => { if (onError) onError(err); });
  };

  window.storage = {
    async get(key, shared) {
      if (shared) {
        const doc = await db.collection('wilcoa').doc(key).get();
        if (!doc.exists) { throw new Error('not_found'); }
        return { key, value: doc.data().value, shared: true };
      }
      const val = localStorage.getItem(key);
      if (val === null) { throw new Error('not_found'); }
      return { key, value: val, shared: false };
    },
    async set(key, value, shared) {
      if (shared) {
        await db.collection('wilcoa').doc(key).set({ value });
        return { key, value, shared: true };
      }
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key, shared) {
      if (shared) {
        await db.collection('wilcoa').doc(key).delete();
        return { key, deleted: true, shared: true };
      }
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
  };

  // ============================================================
  // Guardado seguro para datos compartidos (evita que un
  // dispositivo con datos desactualizados pise lo que otro
  // acaba de guardar, por ejemplo un checklist guardado desde
  // un celular mientras el administrador tenía la app abierta
  // en otra computadora). En vez de subir directamente lo que
  // hay en memoria del dispositivo, storagePatch lee dentro de
  // una transacción la versión más reciente que existe en el
  // servidor, le aplica SOLO el cambio puntual (a través de la
  // función "updater") y recién ahí lo guarda. Si dos personas
  // guardan casi al mismo tiempo, Firestore reintenta la
  // transacción automáticamente para que ambos cambios queden
  // reflejados, en vez de que uno borre al otro.
  // ============================================================
  window.storagePatch = async function (key, updater) {
    const ref = db.collection('wilcoa').doc(key);
    const result = await db.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      const current = snap.exists ? JSON.parse(snap.data().value) : null;
      const next = updater(current);
      tx.set(ref, { value: JSON.stringify(next) });
      return next;
    });
    return result;
  };

  // Avisa en tiempo real (sin esperar a los 15 segundos de
  // sondeo ni a tocar "Actualizar") cuando cambian los datos
  // compartidos, sin importar desde qué dispositivo se guardaron.
  window.storageWatch = function (key, onChange, onError) {
    return db.collection('wilcoa').doc(key).onSnapshot((doc) => {
      if (!doc.exists) return;
      try {
        onChange(JSON.parse(doc.data().value));
      } catch (e) { /* documento con datos corruptos, se ignora este evento */ }
    }, (err) => { if (onError) onError(err); });
  };
</script>

/* ============ CHECKLIST DE INSUMOS (entrega / recibido) ============ */
// Construye la lista de insumos a revisar para ESTA reserva: los fijos/incluidos (siempre
// los mismos) + solo el menaje extra que se marcó como requerido al agendar.
function checklistItemDefsForReservation(r) {
  const ex = r.extras || {};
  const items = CORE_CHECKLIST_ITEMS.map(d => ({ ...d }));
  MENAJE_ITEMS_DEF.forEach(def => {
    const val = ex[def.key];
    if (def.kind === 'qty') {
      const qty = Number(val?.qty) || 0;
      if (qty > 0) items.push({ name: def.label, qty: String(qty) });
    } else if (val?.on) {
      items.push({ name: def.label, qty: '' });
    }
  });
  (ex.otrosItems || []).forEach(it => {
    if (it && it.name) items.push({ name: it.name, qty: it.qty || '' });
  });
  return items;
}
// Suma el monto que se le va a cobrar al cliente por el menaje extra (aparte del alquiler).
function extrasSubtotal(r) {
  const ex = r?.extras || {};
  let sum = 0;
  MENAJE_ITEMS_DEF.forEach(def => {
    const val = ex[def.key];
    const isOn = def.kind === 'qty' ? (Number(val?.qty) || 0) > 0 : !!val?.on;
    if (isOn) sum += Number(val?.monto) || 0;
  });
  (ex.otrosItems || []).forEach(it => { sum += Number(it?.monto) || 0; });
  return sum;
}
function emptyChecklistSide(itemDefs) {
  return {
    items: itemDefs.map(d => ({ id: uid(), name: d.name, qty: d.qty || '', checked: false, state: '', note: '' })),
    observations: '',
    doneBy: '',
    doneAt: '',
  };
}
function emptyChecklistForReservation(r) {
  const defs = checklistItemDefsForReservation(r);
  return { entrega: emptyChecklistSide(defs), recibido: emptyChecklistSide(defs) };
}
function checklistHasDamage(side) {
  return !!(side && side.items && side.items.some(it => it.state === 'malo'));
}

function paymentStatus(r) {
  if (r.isExempt) return 'exonerado';
  const total = Number(r.totalAmount) || 0;
  const paid = Number(r.paidAmount) || 0;
  if (total > 0 && paid >= total) return 'pagado';
  if (paid > 0) return 'abono';
  return 'debe';
}
const STATUS_COLORS = { debe: '#E23B3B', abono: '#F2B705', pagado: '#1B8A3E', exonerado: '#7B4FE0' };
const STATUS_LABELS = { debe: 'Debe todo', abono: 'Abonó', pagado: 'Pagado', exonerado: 'Uso social (exonerado)' };
const STATUS_RANK = { debe: 0, abono: 1, pagado: 2, exonerado: 3 };


/* ============ ROLES Y PERMISOS ============ */
const ROLES = { VIEWER: 'viewer', EDITOR: 'editor', ADMIN: 'admin' };
const ROLE_LABELS = { viewer: 'Solo consulta', editor: 'Editor de reservas', admin: 'Administrador' };
function canCreateEdit(role) { return role === ROLES.EDITOR || role === ROLES.ADMIN; }
function canDelete(role) { return role === ROLES.ADMIN; }
function canManageConfig(role) { return role === ROLES.ADMIN; }

function uid() {
  return 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Comprime y redimensiona una foto tomada con la cámara antes de guardarla,
// para que el texto (base64) resultante entre con margen dentro del límite
// de 1 MB por documento que tiene Firestore. Va bajando la calidad si hace
// falta hasta que quepa cómodo.
function compressImageToDataUrl(file, maxDim = 1280, startQuality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la foto'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo procesar la foto'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let quality = startQuality;
        let out = canvas.toDataURL('image/jpeg', quality);
        while (out.length > 650000 && quality > 0.3) {
          quality -= 0.1;
          out = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function fmtMoney(n) {
  const v = Number(n) || 0;
  return '₡' + v.toLocaleString('es-CR', { maximumFractionDigits: 0 });
}
function toDateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function parseDateKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtDateHuman(key) {
  if (!key) return '';
  const d = parseDateKey(key);
  return d.toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function resizeImage(file, maxDim = 320) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png', 0.9));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ APP PRINCIPAL ============ */
function AgendaWilcoa() {
  const [config, setConfig] = useState(defaultConfig);
  const [reservations, setReservations] = useState([]);
  const [clients, setClients] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('calendar');
  const [cursor, setCursor] = useState(() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() }; });
  const [selectedDate, setSelectedDate] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [showShare, setShowShare] = useState(false);
  const [urlDraft, setUrlDraft] = useState('');
  const [formData, setFormData] = useState(emptyRes);
  const [editingHallName, setEditingHallName] = useState(false);
  const [hallNameDraft, setHallNameDraft] = useState('');
  const [query, setQuery] = useState('');
  const [showClientForm, setShowClientForm] = useState(false);
  const [clientFormData, setClientFormData] = useState({ id: null, name: '', phone: '' });
  const [clientQuery, setClientQuery] = useState('');
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef(null);
  const [refreshing, setRefreshing] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [role, setRole] = useState(ROLES.VIEWER);
  const [showLogin, setShowLogin] = useState(false);
  const [showAccessManager, setShowAccessManager] = useState(false);
  const [showChecklist, setShowChecklist] = useState(false);
  const [checklistRes, setChecklistRes] = useState(null);
  const [reviewerNameEntrega, setReviewerNameEntrega] = useState('');
  const [reviewerNameRecibido, setReviewerNameRecibido] = useState('');
  const [showPhotos, setShowPhotos] = useState(false);
  const [photosRes, setPhotosRes] = useState(null);
  const [photographerName, setPhotographerName] = useState('');

  // Aplica lo que llega del servidor (ya sea de la carga inicial o de un
  // cambio en tiempo real hecho desde otro dispositivo) al estado local,
  // salvo que la persona esté en medio de escribir un formulario: en ese
  // caso se espera a que termine para no interrumpirle lo que está tipeando.
  const applyRemoteData = (parsed) => {
    if (!parsed) return;
    setConfig({ ...defaultConfig, ...(parsed.config || {}) });
    setReservations(Array.isArray(parsed.reservations) ? parsed.reservations : []);
    setClients(Array.isArray(parsed.clients) ? parsed.clients : []);
    setLastSync(new Date());
  };

  // Carga manual/forzada, usada por el botón "Actualizar" (por si la
  // conexión en tiempo real se cortó momentáneamente) y como respaldo
  // inicial mientras se conecta el listener en tiempo real.
  const loadFromStorage = async (silent) => {
    if (!silent) setRefreshing(true);
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) applyRemoteData(JSON.parse(res.value));
    } catch (e) {
      // aún no hay datos guardados, se mantienen los valores por defecto
    } finally {
      setRefreshing(false);
      setLoaded(true);
    }
  };

  // Escucha en tiempo real: en cuanto CUALQUIER dispositivo guarda algo
  // (una reserva, un checklist, un cliente, la configuración del salón),
  // todos los demás dispositivos abiertos lo reciben al instante, sin
  // esperar 15 segundos ni tener que tocar "Actualizar".
  useEffect(() => {
    loadFromStorage(true); // primer dato mientras se conecta el listener
    const unsubscribe = window.storageWatch(
      STORAGE_KEY,
      (parsed) => {
        if (showForm || editingHallName) return; // no interrumpir mientras se escribe un formulario
        applyRemoteData(parsed);
        setLoaded(true);
      },
      () => { /* si falla la conexión en tiempo real, el botón Actualizar sigue funcionando */ }
    );
    return () => unsubscribe && unsubscribe();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [showForm, editingHallName]);

  // Recuerda el rol de esta persona en este dispositivo (almacenamiento personal, no compartido),
  // así no tiene que volver a escribir su código cada vez que abre el link.
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const res = await window.storage.get(SESSION_KEY, false);
        if (res && res.value) {
          const sess = JSON.parse(res.value);
          if (sess.role === ROLES.ADMIN && sess.code && sess.code === config.adminCode) setRole(ROLES.ADMIN);
          else if (sess.role === ROLES.EDITOR && sess.code && sess.code === config.editorCode) setRole(ROLES.EDITOR);
        }
      } catch (e) {
        // no hay sesión guardada en este dispositivo todavía
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  // Recuerda en este dispositivo el nombre de quien entrega y el de quien
  // recibe por separado (no siempre es la misma persona), para no tener
  // que volver a escribirlos cada vez (no requiere sesión: cualquier
  // persona puede usar el checklist).
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const res = await window.storage.get(REVIEWER_KEY_ENTREGA, false);
        if (res && res.value) setReviewerNameEntrega(res.value);
      } catch (e) {
        // aún no se ha guardado un nombre en este dispositivo
      }
      try {
        const res = await window.storage.get(REVIEWER_KEY_RECIBIDO, false);
        if (res && res.value) setReviewerNameRecibido(res.value);
      } catch (e) {
        // aún no se ha guardado un nombre en este dispositivo
      }
      try {
        const res = await window.storage.get(PHOTOGRAPHER_KEY, false);
        if (res && res.value) setPhotographerName(res.value);
      } catch (e) {
        // aún no se ha guardado un nombre en este dispositivo
      }
    })();
  }, [loaded]);

  const updatePhotographerName = (val) => {
    setPhotographerName(val);
    window.storage.set(PHOTOGRAPHER_KEY, val, false).catch(() => {});
  };

  const updateReviewerName = (side, val) => {
    if (side === 'recibido') {
      setReviewerNameRecibido(val);
      window.storage.set(REVIEWER_KEY_RECIBIDO, val, false).catch(() => {});
    } else {
      setReviewerNameEntrega(val);
      window.storage.set(REVIEWER_KEY_ENTREGA, val, false).catch(() => {});
    }
  };

  // Guarda un cambio de forma segura: en vez de subir el estado que hay en
  // memoria de este dispositivo (que puede estar desactualizado si otra
  // persona guardó algo hace unos segundos), "updater" recibe la versión
  // más reciente que existe en el servidor y devuelve solo el cambio
  // puntual que hay que aplicarle. Así nunca se pisa el trabajo de otro
  // dispositivo, aunque dos personas guarden casi al mismo tiempo.
  const persistPatch = async (updater) => {
    setSaving(true);
    try {
      const next = await window.storagePatch(STORAGE_KEY, (current) => {
        const base = current
          ? {
              config: { ...defaultConfig, ...(current.config || {}) },
              reservations: Array.isArray(current.reservations) ? current.reservations : [],
              clients: Array.isArray(current.clients) ? current.clients : [],
            }
          : { config: defaultConfig, reservations: [], clients: [] };
        return updater(base);
      });
      return next;
    } catch (e) {
      showToast('No se pudo guardar. Revisa tu conexión e intenta de nuevo sin cerrar la app.', 'error');
      return null;
    } finally {
      setSaving(false);
    }
  };

  // Avisa al navegador que no cierre/recargue la pestaña mientras hay un guardado en curso,
  // para evitar que una reserva recién tipeada se pierda por cerrar demasiado rápido.
  useEffect(() => {
    const handler = (e) => { e.preventDefault(); e.returnValue = ''; return ''; };
    if (saving) window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [saving]);

  const showToast = (msg, kind = 'ok') => {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 2600);
  };

  const updateConfig = async (patch) => {
    const result = await persistPatch(cur => ({ ...cur, config: { ...cur.config, ...patch } }));
    if (result) {
      setConfig(result.config);
      setReservations(result.reservations);
      setClients(result.clients);
    }
    return !!result;
  };

  const saveReservation = async (data) => {
    const name = (data.clientName || '').trim();
    const phone = (data.phone || '').trim();

    const result = await persistPatch(cur => {
      let nextRes;
      if (data.id) {
        nextRes = cur.reservations.map(r => r.id === data.id ? data : r);
      } else {
        nextRes = [...cur.reservations, { ...data, id: uid() }];
      }
      nextRes.sort((a, b) => a.date.localeCompare(b.date));

      // Guarda o actualiza automáticamente el cliente en el directorio de Clientes
      let nextClients = cur.clients;
      if (name) {
        const existing = cur.clients.find(c => c.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          if (phone && existing.phone !== phone) {
            nextClients = cur.clients.map(c => c.id === existing.id ? { ...c, phone } : c);
          }
        } else {
          nextClients = [...cur.clients, { id: uid(), name, phone }].sort((a, b) => a.name.localeCompare(b.name));
        }
      }
      return { ...cur, reservations: nextRes, clients: nextClients };
    });

    if (result) {
      setReservations(result.reservations);
      setClients(result.clients);
      setConfig(result.config);
      showToast(data.id ? 'Reserva actualizada' : 'Reserva agregada');
    }
    return !!result;
  };

  const deleteReservation = async (id) => {
    if (!canDelete(role)) return false;
    const result = await persistPatch(cur => ({ ...cur, reservations: cur.reservations.filter(r => r.id !== id) }));
    if (result) {
      setReservations(result.reservations);
      showToast('Reserva eliminada', 'ok');
    }
    return !!result;
  };

  const openChecklist = (r) => {
    setChecklistRes(r);
    setShowChecklist(true);
  };

  const saveChecklist = async (resId, side, stampedSide) => {
    // Importante: solo se reemplaza el lado que se acaba de guardar
    // (entrega o recibido), usando siempre la versión más reciente que
    // haya en el servidor para el checklist de esta reserva. Así, si
    // alguien guardó "recibido" desde otro celular mientras vos tenías
    // abierta la pestaña de "entrega", tu guardado no le borra el
    // trabajo a esa otra persona.
    const result = await persistPatch(cur => ({
      ...cur,
      reservations: cur.reservations.map(r => {
        if (r.id !== resId) return r;
        const baseChecklist = r.checklist || emptyChecklistForReservation(r);
        return { ...r, checklist: { ...baseChecklist, [side]: stampedSide } };
      }),
    }));
    if (result) {
      setReservations(result.reservations);
      showToast('Checklist guardado');
    }
    return !!result;
  };

  // Las fotos ya no viven dentro del documento grande de reservas: PhotosModal
  // las lee y las guarda directamente en Firestore (colección "wilcoa_fotos"),
  // así que aquí solo hace falta abrir y cerrar el modal.
  const openPhotos = (r) => {
    setPhotosRes(r);
    setShowPhotos(true);
  };

  const saveClient = async (data) => {
    const result = await persistPatch(cur => {
      let next;
      if (data.id) {
        next = cur.clients.map(c => c.id === data.id ? data : c);
      } else {
        next = [...cur.clients, { ...data, id: uid() }];
      }
      next.sort((a, b) => a.name.localeCompare(b.name));
      return { ...cur, clients: next };
    });
    if (result) {
      setClients(result.clients);
      showToast(data.id ? 'Cliente actualizado' : 'Cliente agregado');
    }
    return !!result;
  };

  const deleteClient = async (id) => {
    if (!canDelete(role)) return false;
    const result = await persistPatch(cur => ({ ...cur, clients: cur.clients.filter(c => c.id !== id) }));
    if (result) {
      setClients(result.clients);
      showToast('Cliente eliminado', 'ok');
    }
    return !!result;
  };

  const handleLogoUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImage(file, 320);
      updateConfig({ logoDataUrl: dataUrl });
      showToast('Logo actualizado');
    } catch {
      showToast('No se pudo cargar la imagen', 'error');
    }
    e.target.value = '';
  };

  const resByDate = useMemo(() => {
    const map = {};
    reservations.forEach(r => { (map[r.date] = map[r.date] || []).push(r); });
    return map;
  }, [reservations]);

  const monthGrid = useMemo(() => {
    const { y, m } = cursor;
    const first = new Date(y, m, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }, [cursor]);

  const filteredReservations = useMemo(() => {
    const q = query.trim().toLowerCase();
    let list = [...reservations];
    if (q) list = list.filter(r => r.clientName.toLowerCase().includes(q) || r.date.includes(q) || (r.phone || '').includes(q));
    return list.sort((a, b) => a.date.localeCompare(b.date));
  }, [reservations, query]);

  const filteredClients = useMemo(() => {
    const q = clientQuery.trim().toLowerCase();
    let list = [...clients];
    if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || (c.phone || '').includes(q));
    return list.sort((a, b) => a.name.localeCompare(b.name));
  }, [clients, clientQuery]);

  const stats = useMemo(() => {
    const now = new Date();
    const upcoming = reservations.filter(r => parseDateKey(r.date) >= new Date(now.getFullYear(), now.getMonth(), now.getDate()));
    const paidReservations = reservations.filter(r => !r.isExempt);
    const exemptReservations = reservations.filter(r => r.isExempt);
    const totalIncomeExpected = paidReservations.reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);
    const totalPaid = paidReservations.reduce((s, r) => s + (Number(r.paidAmount) || 0), 0);
    const pending = totalIncomeExpected - totalPaid;
    const fullyPaidCount = paidReservations.filter(r => (Number(r.paidAmount) || 0) >= (Number(r.totalAmount) || 0) && Number(r.totalAmount) > 0).length;
    const exemptCount = exemptReservations.length;
    const exemptRefTotal = exemptReservations.reduce((s, r) => s + (Number(r.exemptRefValue) || 0), 0);
    return { total: reservations.length, upcoming: upcoming.length, totalIncomeExpected, totalPaid, pending, fullyPaidCount, exemptCount, exemptRefTotal };
  }, [reservations]);

  const openNewForm = (dateKey) => {
    if (!canCreateEdit(role)) return;
    setFormData({ ...emptyRes, id: null, date: dateKey || selectedDate || toDateKey(cursor.y, cursor.m, new Date().getDate()), extras: { ...emptyExtras } });
    setShowForm(true);
  };
  const openEditForm = (r) => {
    if (!canCreateEdit(role)) return;
    setFormData({ ...emptyRes, ...r, extras: { ...emptyExtras, ...r.extras } });
    setShowForm(true);
  };
  const openNewClientForm = () => {
    if (!canCreateEdit(role)) return;
    setClientFormData({ id: null, name: '', phone: '' });
    setShowClientForm(true);
  };
  const openEditClientForm = (c) => {
    if (!canCreateEdit(role)) return;
    setClientFormData({ ...c });
    setShowClientForm(true);
  };

  if (!loaded) {
    return (
      <div style={{ ...styles.app, alignItems: 'center', justifyContent: 'center', display: 'flex' }}>
        <div style={{ color: '#fff', fontFamily: 'Inter, sans-serif', fontSize: 15, opacity: 0.85 }}>Cargando Agenda Wilcoa…</div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <style>{fontImport}</style>
      <div style={styles.bgGlowA} />
      <div style={styles.bgGlowB} />

      <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleLogoUpload} />

      <header style={styles.header}>
        <div style={styles.headerLeft}>
          <div
            style={styles.logoWrap}
            onClick={() => { if (canManageConfig(role)) fileInputRef.current?.click(); }}
            title={canManageConfig(role) ? 'Cambiar logo' : ''}
          >
            {config.logoDataUrl ? (
              <img src={config.logoDataUrl} alt="logo" style={styles.logoImg} />
            ) : (
              <Icon name="Building2" size={28} color="#0B1F5C" />
            )}
            {canManageConfig(role) && (
              <div style={styles.logoEditBadge}><Icon name="Upload" size={11} color="#fff" /></div>
            )}
          </div>
          <div>
            <div style={styles.brandRow}>
              <Icon name="Sparkles" size={14} color="#47C3EF" />
              <span style={styles.brandLabel}>AGENDA WILCOA</span>
            </div>
            {editingHallName ? (
              <input
                autoFocus
                value={hallNameDraft}
                onChange={e => setHallNameDraft(e.target.value)}
                onBlur={() => { updateConfig({ hallName: hallNameDraft.trim() || config.hallName }); setEditingHallName(false); }}
                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                style={styles.hallNameInput}
              />
            ) : (
              <h1
                style={styles.hallName}
                onClick={() => { if (canManageConfig(role)) { setHallNameDraft(config.hallName); setEditingHallName(true); } }}
                title={canManageConfig(role) ? 'Editar nombre del salón' : ''}
              >
                {config.hallName}
                {canManageConfig(role) && <Icon name="Edit2" size={13} style={{ marginLeft: 8, opacity: 0.5 }} color="#fff" />}
              </h1>
            )}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
          <button
            style={{ ...styles.accessBadge, ...(role === ROLES.ADMIN ? styles.accessBadgeAdmin : role === ROLES.EDITOR ? styles.accessBadgeEditor : {}) }}
            onClick={() => { if (role === ROLES.VIEWER) setShowLogin(true); }}
            title={role === ROLES.VIEWER ? 'Iniciar sesión con código de acceso' : 'Sesión activa'}
          >
            <Icon name="User" size={13} color="#fff" /> {ROLE_LABELS[role]}
          </button>
          {role !== ROLES.VIEWER && (
            <button
              style={styles.logoutBtn}
              onClick={async () => {
                setRole(ROLES.VIEWER);
                try { await window.storage.delete(SESSION_KEY, false); } catch (e) { /* no había sesión guardada */ }
              }}
            >
              Cerrar sesión
            </button>
          )}
          {canManageConfig(role) && (
            <button style={styles.shareBtn} onClick={() => setShowAccessManager(true)}>
              <Icon name="Edit2" size={14} color="#fff" /> Códigos de acceso
            </button>
          )}
          {canManageConfig(role) && (
            <button style={styles.shareBtn} onClick={() => { setUrlDraft(config.publishedUrl || ''); setShowShare(true); }}>
              <Icon name="Share2" size={16} color="#fff" /> Compartir
            </button>
          )}
          {canCreateEdit(role) && (
            <button style={styles.newBtn} onClick={() => openNewForm(null)}>
              <Icon name="Plus" size={17} color="#fff" /> Nueva reserva
            </button>
          )}
        </div>
      </header>

      <nav style={styles.tabs}>
        {[
          { id: 'calendar', label: 'Calendario', icon: 'LayoutGrid' },
          { id: 'list', label: 'Reservas', icon: 'List' },
          { id: 'clients', label: 'Clientes', icon: 'User' },

      {showLogin && (
        <LoginModal
          config={config}
          onClose={() => setShowLogin(false)}
          onLogin={async (r, code) => {
            setRole(r);
            setShowLogin(false);
            try { await window.storage.set(SESSION_KEY, JSON.stringify({ role: r, code }), false); } catch (e) { /* no se pudo recordar en este dispositivo, no es grave */ }
            showToast(r === ROLES.ADMIN ? 'Sesión de administrador iniciada' : 'Sesión de editor iniciada');
          }}
        />

      {showAccessManager && canManageConfig(role) && (
        <AccessManagerModal
          config={config}
          onClose={() => setShowAccessManager(false)}
          onSave={async (adminCode, editorCode) => {
            const ok = await updateConfig({ adminCode, editorCode });
            if (ok) {
              setShowAccessManager(false);
              showToast('Códigos actualizados');
              // Actualiza la sesión de este dispositivo con el código nuevo para no cerrar tu propia sesión
              const myNewCode = role === ROLES.ADMIN ? adminCode : role === ROLES.EDITOR ? editorCode : null;
              if (myNewCode) {
                try { await window.storage.set(SESSION_KEY, JSON.stringify({ role, code: myNewCode }), false); } catch (e) {}
              }
            }

      )}

      {toast && (
        <div style={{ ...styles.toast, ...(toast.kind === 'error' ? styles.toastError : {}) }}>

        </div>
      )}

      <FloatingCalculator />
    </div>
  );
}

function ReservationCard({ r, onEdit, onDelete, onChecklist, onPhotos, showDate, defaultOpen, role }) {
  const [open, setOpen] = useState(!!defaultOpen);
  const total = Number(r.totalAmount) || 0;
  const paid = Number(r.paidAmount) || 0;
  const deposit = Number(r.depositAmount) || 0;
  const status = paymentStatus(r);
  const canEditCard = canCreateEdit(role);
  const canRemoveCard = canDelete(role);
  const hasDamage = !!(r.checklist && (checklistHasDamage(r.checklist.entrega) || checklistHasDamage(r.checklist.recibido)));
  const timeRange = r.startTime && r.endTime ? `${r.startTime} – ${r.endTime}` : (r.startTime || r.endTime || '');
  const extrasList = [];
  MENAJE_ITEMS_DEF.forEach(def => {
    const val = r.extras?.[def.key];
    if (def.kind === 'qty') {
      const qty = Number(val?.qty) || 0;
      if (qty > 0) extrasList.push({ icon: def.icon, label: `${qty} ${def.label.toLowerCase()}`, monto: Number(val?.monto) || 0 });
    } else if (val?.on) {
      extrasList.push({ icon: def.icon, label: def.label, monto: Number(val?.monto) || 0 });
    }
  });
  (r.extras?.otrosItems || []).forEach(it => {
    if (it && it.name) extrasList.push({ icon: 'Package', label: it.qty ? `${it.name} (${it.qty})` : it.name, monto: Number(it.monto) || 0 });
  });
  const extrasTotal = extrasSubtotal(r);

  return (
    <div style={styles.resCard}>
      <div style={styles.resCardTop} onClick={() => setOpen(o => !o)} role="button">
        <div style={{ minWidth: 0 }}>
          <div style={styles.resClient}><Icon name="User" size={14} color="#0B1F5C" /> {r.clientName || 'Sin nombre'}</div>
          {showDate && <div style={styles.resDateSmall}><Icon name="Calendar" size={12} color="#8FA3C9" /> {fmtDateHuman(r.date)}</div>}
          {timeRange && <div style={styles.resDateSmall}><Icon name="Clock" size={12} color="#8FA3C9" /> {timeRange}</div>}
          {showDate && r.phone && <div style={styles.resDateSmall}><Icon name="Phone" size={12} color="#8FA3C9" /> {r.phone}</div>}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {hasDamage && (
            <div style={styles.damageBadge}><Icon name="AlertCircle" size={11} color="#fff" /> Daños</div>
          )}
          <div style={{ ...styles.statusPill, background: `${STATUS_COLORS[status]}1F`, color: STATUS_COLORS[status] }}>
            {status === 'pagado' ? <Icon name="CheckCircle2" size={12} color={STATUS_COLORS[status]} /> : <Icon name="Clock" size={12} color={STATUS_COLORS[status]} />} {STATUS_LABELS[status]}
          </div>
          <Icon name="ChevronDown" size={16} color="#8FA3C9" style={{ transition: 'transform 0.2s ease', transform: open ? 'rotate(180deg)' : 'rotate(0deg)' }} />
        </div>
      </div>

      {open && (
        <div style={styles.resCardBody}>
          {r.phone && <div style={styles.resPhone}><Icon name="Phone" size={12} color="#8FA3C9" /> {r.phone}</div>}

          {r.isExempt ? (
            <div style={styles.exemptBox}>
              <Icon name="Sparkles" size={14} color="#5B2FBF" />
              <div>
                <div style={{ fontWeight: 700 }}>Uso social exonerado de pago</div>
                {r.exemptReason && <div style={{ marginTop: 2 }}>{r.exemptReason}</div>}
                {Number(r.exemptRefValue) > 0 && (
                  <div style={{ marginTop: 4, fontSize: 11, opacity: 0.75 }}>Valor referencial (no es ingreso): {fmtMoney(r.exemptRefValue)}</div>
                )}
              </div>
            </div>
          ) : (
            <>
              <div style={styles.moneyRow}>
                <div style={styles.moneyBlock}>
                  <span style={styles.moneyLabel}>Total</span>
                  <span style={styles.moneyVal}>{fmtMoney(total)}</span>
                </div>
                <div style={styles.moneyBlock}>
                  <span style={styles.moneyLabel}>Abonado</span>
                  <span style={{ ...styles.moneyVal, color: '#1B8A3E' }}>{fmtMoney(paid)}</span>
                </div>
                <div style={styles.moneyBlock}>
                  <span style={styles.moneyLabel}>Saldo</span>
                  <span style={{ ...styles.moneyVal, color: total - paid > 0 ? '#FF6B4A' : '#1B8A3E' }}>{fmtMoney(Math.max(total - paid, 0))}</span>
                </div>
              </div>

              {deposit > 0 && (
                <div style={styles.depositRow}>
                  <Icon name="Sparkles" size={12} color="#8A6D00" /> Depósito de garantía: <strong>{fmtMoney(deposit)}</strong>
                </div>
              )}
            </>
          )}

          {extrasList.length > 0 && (
            <div style={styles.extrasRow}>
              {extrasList.map((ex, i) => (
                <span key={i} style={styles.extraChip}>
                  <Icon name={ex.icon} size={12} color="#1D6E92" /> {ex.label}{ex.monto > 0 ? ` · ${fmtMoney(ex.monto)}` : ''}
                </span>
              ))}
            </div>
          )}
          {extrasTotal > 0 && (
            <div style={styles.extrasSubtotalRow}>
              <Icon name="DollarSign" size={12} color="#8A6D00" /> Menaje extra (aparte del alquiler): <strong>{fmtMoney(extrasTotal)}</strong>
            </div>
          )}

          {r.notes && <div style={styles.notesBox}><Icon name="StickyNote" size={12} color="#6B7B9E" /> {r.notes}</div>}

          <div style={styles.cardActions}>
            <button style={{ ...styles.iconBtn, background: 'rgba(71,195,239,0.15)', color: '#1D6E92' }} onClick={(e) => { e.stopPropagation(); onChecklist(); }}>
              <Icon name="Package" size={14} color="#1D6E92" /> Checklist de insumos
            </button>
            <button style={{ ...styles.iconBtn, background: 'rgba(123,79,224,0.12)', color: '#5B2FBF' }} onClick={(e) => { e.stopPropagation(); onPhotos(); }}>
              <Icon name="Camera" size={14} color="#5B2FBF" /> Fotos

              <button style={styles.iconBtn} onClick={(e) => { e.stopPropagation(); onEdit(); }}><Icon name="Edit2" size={14} color="#0B1F5C" /> Editar</button>
            )}
            {canRemoveCard && (
              <button style={{ ...styles.iconBtn, color: '#FF6B4A' }} onClick={(e) => { e.stopPropagation(); onDelete(); }}><Icon name="Trash2" size={14} color="#FF6B4A" /> Eliminar</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function ReservationForm({ data, onCancel, onSave, saving, clients }) {
  const [d, setD] = useState(data);
  const [submitting, setSubmitting] = useState(false);
  const [newItemName, setNewItemName] = useState('');
  const [newItemQty, setNewItemQty] = useState('');
  const [newItemMonto, setNewItemMonto] = useState('');
  const [menajeMenuOpen, setMenajeMenuOpen] = useState(false);
  const [menajeSearch, setMenajeSearch] = useState('');
  const set = (patch) => setD(prev => ({ ...prev, ...patch }));
  const setExtra = (patch) => setD(prev => ({ ...prev, extras: { ...prev.extras, ...patch } }));
  const addOtroItem = () => {
    const name = newItemName.trim();
    if (!name) return;
    setExtra({ otrosItems: [...(d.extras.otrosItems || []), { id: uid(), name, qty: newItemQty.trim(), monto: newItemMonto.trim() }] });
    setNewItemName('');
    setNewItemQty('');
    setNewItemMonto('');
  };
  const removeOtroItem = (id) => {
    setExtra({ otrosItems: (d.extras.otrosItems || []).filter(it => it.id !== id) });
  };
  const updateOtroItemMonto = (id, monto) => {
    setExtra({ otrosItems: (d.extras.otrosItems || []).map(it => it.id === id ? { ...it, monto } : it) });
  };

  // Insumo "seleccionado" = este cliente lo va a necesitar además del alquiler (por eso sale
  // del menú y aparece marcado abajo, que es justo lo que luego arma el checklist y lo que
  // se le cobra aparte del alquiler del salón).
  const isMenajeSelected = (def) => def.kind === 'qty' ? Number(d.extras[def.key]?.qty) > 0 : !!d.extras[def.key]?.on;
  const selectedMenajeDefs = MENAJE_ITEMS_DEF.filter(isMenajeSelected);
  const availableMenajeDefs = MENAJE_ITEMS_DEF.filter(def => !isMenajeSelected(def) &&
    def.label.toLowerCase().includes(menajeSearch.trim().toLowerCase()));
  const addMenajeFromMenu = (def) => {
    setExtra({ [def.key]: def.kind === 'qty' ? { qty: 1, monto: '' } : { on: true, monto: '' } });
  };
  const removeMenajeItem = (def) => {
    setExtra({ [def.key]: def.kind === 'qty' ? { qty: 0, monto: '' } : { on: false, monto: '' } });
  };
  const bumpMenajeQty = (def, delta) => {
    const current = Number(d.extras[def.key]?.qty) || 0;
    const next = current + delta;
    if (next <= 0) { removeMenajeItem(def); return; }
    setExtra({ [def.key]: { ...d.extras[def.key], qty: next } });
  };
  const updateMenajeMonto = (def, monto) => {
    setExtra({ [def.key]: { ...d.extras[def.key], monto } });
  };
  const addOtroItemFromMenu = () => {
    addOtroItem();
  };
  const menajeExtrasTotal = extrasSubtotal(d);

  const canSave = d.date && d.clientName.trim().length > 0 && (!d.isExempt || d.exemptReason.trim().length > 0);

  const handleSave = async () => {
    if (submitting || !canSave) return;
    setSubmitting(true);
    await onSave(d);
    setSubmitting(false); // si el guardado fue exitoso el modal ya se cerró y este componente se desmontó
  };

  const safeCancel = () => { if (!submitting) onCancel(); };

  return (
    <div style={styles.modalOverlay} onClick={safeCancel}>
      <div style={styles.modal} onClick={e => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <h2 style={styles.modalTitle}>{d.id ? 'Editar reserva' : 'Nueva reserva'}</h2>
          <button style={styles.closeBtn} onClick={safeCancel} disabled={submitting}><Icon name="X" size={18} color="#5C6D93" /></button>
        </div>

        <div className="wilcoa-form-grid" style={styles.formGrid}>
          <Field label="Fecha del evento">
            <input type="date" value={d.date} onChange={e => set({ date: e.target.value })} style={styles.input} />
          </Field>
          <Field label="Nombre del cliente">
            <input
              placeholder="Ej: María Rodríguez"
              value={d.clientName}
              list="wilcoa-clients-list"
              onChange={e => {
                const val = e.target.value;
                const match = clients.find(c => c.name === val);
                set(match && !d.phone ? { clientName: val, phone: match.phone } : { clientName: val });
              }}
              style={styles.input}
            />
            <datalist id="wilcoa-clients-list">

function ShareModal({ urlDraft, setUrlDraft, onClose, onSaveUrl, hallName }) {
  const [copied, setCopied] = useState(false);
  const [qrStatus, setQrStatus] = useState('loading');
  const qrBoxRef = useRef(null);
  const validUrl = /^https?:\/\/.+/.test(urlDraft.trim());

  useEffect(() => {
    if (window.QRCode) { setQrStatus('ready'); return; }
    const existing = document.getElementById('wilcoa-qrcode-lib');
    if (existing) {
      existing.addEventListener('load', () => setQrStatus('ready'));
      existing.addEventListener('error', () => setQrStatus('error'));
      return;
    }
    const script = document.createElement('script');
    script.id = 'wilcoa-qrcode-lib';
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    script.onload = () => setQrStatus('ready');
    script.onerror = () => setQrStatus('error');
    document.head.appendChild(script);
  }, []);

  useEffect(() => {
    if (qrStatus === 'ready' && validUrl && qrBoxRef.current && window.QRCode) {
      qrBoxRef.current.innerHTML = '';
      try {
        new window.QRCode(qrBoxRef.current, {
          text: urlDraft.trim(),
          width: 200,
          height: 200,
          colorDark: '#0B1F5C',
          colorLight: '#ffffff',
          correctLevel: window.QRCode.CorrectLevel.M,
        });
      } catch {
        setQrStatus('error');
      }
    }
  }, [qrStatus, validUrl, urlDraft]);

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(urlDraft.trim());
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch {}
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.modal} onClick={e => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <h2 style={styles.modalTitle}><Icon name="Share2" size={18} color="#0B1F5C" style={{ marginRight: 6, verticalAlign: -3 }} /> Compartir {hallName}</h2>
          <button style={styles.closeBtn} onClick={onClose}><Icon name="X" size={18} color="#5C6D93" /></button>
        </div>

        <Field label="Pega aquí el link publicado (una sola vez)">
          <input
            placeholder="https://wilcoa2026521.github.io/junta-directiva/"
            value={urlDraft}
            onChange={e => setUrlDraft(e.target.value)}
            style={styles.input}
          />
        </Field>
        <p style={styles.shareHint}>
          Pega aquí la dirección donde publicaste esta agenda, para poder compartirla con QR.
        </p>

        {validUrl && (
          <div style={styles.qrBox}>
            <div ref={qrBoxRef} style={styles.qrImg}>
              {qrStatus !== 'ready' && (
                <div style={styles.qrPlaceholder}>
                  {qrStatus === 'loading' ? 'Generando código QR…' : 'No se pudo generar el QR aquí. Usa "Copiar link" y compártelo por WhatsApp.'}
                </div>
              )}
            </div>
            <p style={styles.qrCaption}><Icon name="QrCode" size={13} color="#5C6D93" style={{ verticalAlign: -2 }} /> Cualquiera puede escanear este código con la cámara del celular para abrir la agenda directamente.</p>
            <div style={{ display: 'flex', gap: 8, width: '100%' }}>
              <button style={styles.cancelBtn} onClick={handleCopy}><Icon name="Copy" size={14} color="#5C6D93" style={{ marginRight: 6, verticalAlign: -2 }} />{copied ? 'Copiado' : 'Copiar link'}</button>
              <button style={styles.saveBtn} onClick={onSaveUrl}><Icon name="Save" size={15} color="#fff" /> Guardar</button>
            </div>
          </div>
        )}

        {!validUrl && (
          <div style={styles.modalActions}>
            <button style={styles.cancelBtn} onClick={onClose}>Cerrar</button>
          </div>
        )}
      </div>
    </div>
  );
}

function LoginModal({ config, onClose, onLogin }) {
  const [code, setCode] = useState('');
  const [error, setError] = useState('');

  const submit = () => {
    const val = code.trim();
    if (!val) return;
    if (config.adminCode && val === config.adminCode) { onLogin(ROLES.ADMIN, val); return; }
    if (config.editorCode && val === config.editorCode) { onLogin(ROLES.EDITOR, val); return; }
    setError('Código incorrecto. Verifica con la junta directiva.');
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={{ ...styles.modal, maxWidth: 380 }} onClick={e => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <h2 style={styles.modalTitle}>Iniciar sesión</h2>
          <button style={styles.closeBtn} onClick={onClose}><Icon name="X" size={18} color="#5C6D93" /></button>
        </div>
        <Field label="Código de acceso">
          <input
            type="password"
            autoFocus
            placeholder="Ingresa tu código"
            value={code}
            onChange={e => { setCode(e.target.value); setError(''); }}
            onKeyDown={e => { if (e.key === 'Enter') submit(); }}
            style={styles.input}
          />
        </Field>
        {error && <p style={{ color: '#E23B3B', fontSize: 12.5, margin: '4px 0 8px' }}>{error}</p>}
        <p style={styles.shareHint}>
          Los códigos de Administrador y Editor los define la persona administradora desde "Códigos de acceso".
          Si no tienes uno, puedes seguir consultando la agenda, el calendario y el resumen sin iniciar sesión.

        <div style={styles.modalActions}>
          <button style={styles.cancelBtn} onClick={onClose}>Cancelar</button>
          <button style={styles.saveBtn} onClick={submit}><Icon name="Check" size={15} color="#fff" /> Entrar</button>
        </div>

    </div>
  );
}

function ChecklistModal({ res, reviewerNameEntrega, reviewerNameRecibido, onReviewerNameChange, onClose, onSave }) {
  const [data, setData] = useState(() => res.checklist || emptyChecklistForReservation(res));
  const [side, setSide] = useState('entrega');
  const [submitting, setSubmitting] = useState(false);
  const [newItemName, setNewItemName] = useState('');
  const [newItemQty, setNewItemQty] = useState('');

  // La última entrega/recepción ya guardada (y sincronizada desde
  // cualquier dispositivo) se guarda aparte, sin tocar, para poder
  // mostrarla abajo aunque alguien esté escribiendo un nombre nuevo
  // encima sin haber guardado todavía.
  const savedEntrega = res.checklist ? res.checklist.entrega : null;
  const savedRecibido = res.checklist ? res.checklist.recibido : null;
  const savedSide = side === 'recibido' ? savedRecibido : savedEntrega;

  // Si esta reserva ya tiene un nombre guardado para este lado (por
  // ejemplo, Wilmar ya entregó desde su celular), se usa ese nombre
  // sin importar desde qué dispositivo se esté mirando. Si todavía
  // nadie lo hizo, se sugiere el último nombre que se usó en ESTE
  // dispositivo, solo como punto de partida cómodo para no re-tipear.
  useEffect(() => {
    setData(prev => ({
      entrega: prev.entrega.doneBy ? prev.entrega : { ...prev.entrega, doneBy: reviewerNameEntrega },
      recibido: prev.recibido.doneBy ? prev.recibido : { ...prev.recibido, doneBy: reviewerNameRecibido },
    }));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const current = data[side];
  const setCurrent = (patch) => setData(prev => ({ ...prev, [side]: { ...prev[side], ...patch } }));
  const setItem = (itemId, patch) => setCurrent({ items: current.items.map(it => it.id === itemId ? { ...it, ...patch } : it) });
  const addItem = () => {
    const name = newItemName.trim();
    if (!name) return;
    setCurrent({ items: [...current.items, { id: uid(), name, qty: newItemQty.trim(), checked: false, state: '', note: '' }] });
    setNewItemName('');
    setNewItemQty('');
  };
  const removeItem = (itemId) => {
    setCurrent({ items: current.items.filter(it => it.id !== itemId) });
  };
  const damage = checklistHasDamage(current);
  const checkedCount = current.items.filter(it => it.checked).length;

  const safeCancel = () => { if (!submitting) onClose(); };

  const handleSave = async () => {
    if (submitting) return;
    setSubmitting(true);
    const stamped = { ...current, doneBy: current.doneBy.trim(), doneAt: new Date().toISOString() };
    await onSave(side, stamped);
    setSubmitting(false);
  };

  return (
    <div style={styles.modalOverlay} onClick={safeCancel}>
      <div style={{ ...styles.modal, maxWidth: 640 }} onClick={e => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <h2 style={styles.modalTitle}>Checklist de insumos</h2>
          <button style={styles.closeBtn} onClick={safeCancel} disabled={submitting}><Icon name="X" size={18} color="#5C6D93" /></button>
        </div>
        <p style={styles.shareHint}>
          <strong>{res.clientName || 'Reserva'}</strong> — {fmtDateHuman(res.date)}. Cualquier persona de la junta puede usar esta lista al entregar y al recibir el salón, sin necesidad de código de acceso.
        </p>

        <div style={styles.tabs2}>
          <button style={{ ...styles.tabBtn2, ...(side === 'entrega' ? styles.tabBtn2Active : {}) }} onClick={() => setSide('entrega')}>
            <Icon name="Upload" size={13} color={side === 'entrega' ? '#0B1F5C' : 'currentColor'} /> Entrega al cliente
          </button>
          <button style={{ ...styles.tabBtn2, ...(side === 'recibido' ? styles.tabBtn2Active : {}) }} onClick={() => setSide('recibido')}>
            <Icon name="RefreshCw" size={13} color={side === 'recibido' ? '#0B1F5C' : 'currentColor'} /> Recibido del cliente
          </button>
        </div>

        <Field label={side === 'recibido' ? 'Tu nombre (quien recibe ahora)' : 'Tu nombre (quien entrega ahora)'}>
          <input
            placeholder="Ej: Juan Pérez"
            value={current.doneBy}
            onChange={e => { setCurrent({ doneBy: e.target.value }); onReviewerNameChange(side, e.target.value); }}
            style={styles.input}
          />
        </Field>

        {damage && (
          <div style={styles.damageAlert}>
            <Icon name="AlertCircle" size={16} color="#fff" />
            Se reportaron daños o faltantes en esta lista. No se debe devolver el depósito hasta resolverlo con el cliente.
          </div>
        )}

          </div>
          {current.items.map(it => (
            <div key={it.id} className="wilcoa-checklist-row" style={styles.checklistRow}>

              <input
                style={styles.checklistQtyInput}
                value={it.qty}

                <input type="checkbox" checked={it.checked} onChange={e => setItem(it.id, { checked: e.target.checked })} />

              <select style={styles.checklistSelect} value={it.state} onChange={e => setItem(it.id, { state: e.target.value })}>
                <option value="">Sin revisar</option>
                <option value="bueno">Buen estado</option>
                <option value="malo">Mal estado / dañado</option>

              <button type="button" style={styles.checklistRemoveBtn} onClick={() => removeItem(it.id)} title="Quitar de esta lista">
                <Icon name="X" size={12} color="#B23B26" />
              </button>
              {it.state === 'malo' && (
                <input
                  style={{ ...styles.input, gridColumn: '1 / -1', marginTop: 2 }}
                  placeholder="Describe el daño o el faltante…"
                  value={it.note}
                  onChange={e => setItem(it.id, { note: e.target.value })}

              )}

        </div>

        <div style={styles.checklistAddRow}>

          <input placeholder="Cant." value={newItemQty} onChange={e => setNewItemQty(e.target.value)} style={{ ...styles.input, flex: 1 }} />

        </div>

        <p style={{ fontSize: 11.5, color: '#8FA3C9', margin: '4px 0 8px' }}>{checkedCount} de {current.items.length} insumos marcados.</p>

        <Field label="Observaciones generales">
          <textarea
            rows={3}
            style={{ ...styles.input, resize: 'vertical', fontFamily: 'inherit' }}
            value={current.observations}
            onChange={e => setCurrent({ observations: e.target.value })}
            placeholder="Notas adicionales sobre la entrega o la recepción…"
          />
        </Field>

        {savedSide && savedSide.doneBy && (
          <p style={{ fontSize: 11.5, color: '#8FA3C9', margin: '0 0 8px' }}>
            {side === 'recibido' ? 'Última recepción registrada por' : 'Última entrega registrada por'}: {savedSide.doneBy}{savedSide.doneAt ? ` — ${new Date(savedSide.doneAt).toLocaleString('es-CR')}` : ''}
          </p>
        )}

        <div style={styles.modalActions}>
          <button style={styles.cancelBtn} onClick={safeCancel} disabled={submitting}>Cerrar</button>
          <button style={{ ...styles.saveBtn, ...(submitting ? styles.saveBtnDisabled : {}) }} disabled={submitting} onClick={handleSave}>
            <Icon name="Save" size={15} color="#fff" /> Guardar checklist
          </button>
        </div>
      </div>
    </div>
  );
}

// Fotos de la reserva: cualquier persona (sin importar su rol) puede tomar
// fotos con la cámara del celular o subirlas desde la galería, y quedan
// guardadas en esta reserva para que cualquiera que abra la app las vea,
// sin importar desde qué aparato se tomaron.
function PhotosModal({ res, photographerName, onPhotographerNameChange, onClose }) {
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);
  const [photos, setPhotos] = useState([]);
  const [loadingPhotos, setLoadingPhotos] = useState(true);
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  const [lightboxId, setLightboxId] = useState(null);

  // Escucha en tiempo real las fotos de ESTA reserva desde Firestore, sin
  // importar desde qué celular se hayan tomado.
  useEffect(() => {
    setLoadingPhotos(true);
    const unsubscribe = window.wilcoaWatchPhotos(res.id, (list) => {
      setPhotos([...list].sort((a, b) => (b.takenAt || '').localeCompare(a.takenAt || '')));
      setLoadingPhotos(false);
    }, () => {
      setError('No se pudieron cargar las fotos. Revisa tu conexión.');
      setLoadingPhotos(false);
    });
    return () => { if (unsubscribe) unsubscribe(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [res.id]);

  const lightboxPhoto = photos.find(p => p.id === lightboxId) || null;

  const handleFileSelected = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // permite volver a elegir la misma foto si hace falta
    if (!file) return;
    setError('');
    setUploading(true);
    try {
      const dataUrl = await compressImageToDataUrl(file);
      await window.wilcoaSavePhoto(res.id, dataUrl, photographerName.trim());
    } catch (err) {
      setError('No se pudo guardar la foto. Revisa tu conexión e intenta de nuevo.');
    } finally {
      setUploading(false);
    }
  };

  const handleDelete = async (photoId) => {
    if (!window.confirm('¿Eliminar esta foto? No se puede deshacer.')) return;
    setLightboxId(null);
    try {
      await window.wilcoaDeletePhotoDoc(photoId);
    } catch (err) {
      setError('No se pudo eliminar la foto. Intenta de nuevo.');
    }
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={{ ...styles.modal, maxWidth: 560 }} onClick={e => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <h2 style={styles.modalTitle}>Fotos de la reserva{photos.length > 0 ? ` (${photos.length})` : ''}</h2>
          <button style={styles.closeBtn} onClick={onClose}><Icon name="X" size={18} color="#5C6D93" /></button>
        </div>
        <p style={styles.shareHint}>
          <strong>{res.clientName || 'Reserva'}</strong> — {fmtDateHuman(res.date)}. Cualquier persona puede tomar y ver estas fotos, por ejemplo para dejar evidencia del estado del salón.
        </p>

        <Field label="Tu nombre (quien toma la foto)">
          <input
            placeholder="Ej: Juan Pérez"
            value={photographerName}
            onChange={e => onPhotographerNameChange(e.target.value)}
            style={styles.input}
          />
        </Field>

        <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={handleFileSelected} />
        <input ref={galleryInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFileSelected} />

        <div style={styles.photoActionsRow}>
          <button
            type="button"
            style={{ ...styles.cameraActionBtn, ...(uploading ? styles.cameraActionBtnDisabled : {}) }}
            disabled={uploading}
            onClick={() => cameraInputRef.current && cameraInputRef.current.click()}
          >
            <Icon name="Camera" size={20} color="#fff" /> Tomar foto
          </button>
          <button
            type="button"
            style={{ ...styles.galleryActionBtn, ...(uploading ? styles.cameraActionBtnDisabled : {}) }}
            disabled={uploading}
            onClick={() => galleryInputRef.current && galleryInputRef.current.click()}
          >
            <Icon name="Upload" size={20} color="#5C6D93" /> Subir de la galería
          </button>
        </div>

        {uploading && (
          <div style={styles.uploadingBanner}>
            <Icon name="RefreshCw" size={14} color="#1D6E92" style={{ animation: 'wilcoa-spin 0.8s linear infinite' }} /> Guardando foto…
          </div>
        )}
        {error && (
          <div style={styles.photoErrorBanner}>
            <Icon name="AlertCircle" size={16} color="#fff" /> {error}
          </div>
        )}

        {loadingPhotos ? (
          <div style={styles.photosLoadingState}>
            <Icon name="RefreshCw" size={16} color="#8FA3C9" style={{ animation: 'wilcoa-spin 0.8s linear infinite' }} /> Cargando fotos…
          </div>
        ) : photos.length === 0 ? (
          <div style={styles.photosEmptyState}>
            <Icon name="Camera" size={22} color="#C7D2EA" />
            <p style={{ margin: '8px 0 0' }}>Todavía no hay fotos en esta reserva. Tocá "Tomar foto" para agregar la primera.</p>
          </div>
        ) : (
          <div className="wilcoa-photos-grid" style={styles.photosGrid}>
            {photos.map(p => (
              <div key={p.id} style={styles.photoThumbWrap} onClick={() => setLightboxId(p.id)}>
                <img src={p.dataUrl} alt={`Foto de ${res.clientName || 'la reserva'}`} style={styles.photoThumbImg} loading="lazy" />
                {(p.takenBy || p.takenAt) && (
                  <div style={styles.photoThumbMeta}>
                    {p.takenBy || 'Sin nombre'}{p.takenAt ? ` · ${new Date(p.takenAt).toLocaleDateString('es-CR')}` : ''}
                  </div>
                )}
                <button
                  type="button"
                  style={styles.photoDeleteBtn}
                  onClick={(e) => { e.stopPropagation(); handleDelete(p.id); }}
                  title="Eliminar foto"
                >
                  <Icon name="X" size={12} color="#fff" />
                </button>
              </div>
            ))}
          </div>
        )}

        <div style={styles.modalActions}>
          <button style={styles.cancelBtn} onClick={onClose}>Cerrar</button>
        </div>
      </div>

      {lightboxPhoto && (
        <div style={styles.lightboxOverlay} onClick={(e) => { e.stopPropagation(); setLightboxId(null); }}>
          <img src={lightboxPhoto.dataUrl} alt="" style={styles.lightboxImg} onClick={e => e.stopPropagation()} />
          <div style={styles.lightboxBar} onClick={e => e.stopPropagation()}>
            <span style={styles.lightboxMeta}>
              {lightboxPhoto.takenBy ? `Tomada por ${lightboxPhoto.takenBy}` : 'Sin nombre registrado'}
              {lightboxPhoto.takenAt ? ` — ${new Date(lightboxPhoto.takenAt).toLocaleString('es-CR')}` : ''}
            </span>
            <div style={styles.lightboxBtns}>
              <button style={styles.lightboxBtn} onClick={() => handleDelete(lightboxPhoto.id)} title="Eliminar foto">
                <Icon name="Trash2" size={16} color="#fff" />
              </button>
              <button style={styles.lightboxBtn} onClick={() => setLightboxId(null)} title="Cerrar">
                <Icon name="X" size={16} color="#fff" />
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FloatingCalculator() {
  const [open, setOpen] = useState(false);
  const [display, setDisplay] = useState('0');
  const [stored, setStored] = useState(null);
  const [operator, setOperator] = useState(null);
  const [memory, setMemory] = useState(0);
  const [waitingNew, setWaitingNew] = useState(false);

  const inputDigit = (d) => {
    if (waitingNew) { setDisplay(d); setWaitingNew(false); return; }
    setDisplay(display === '0' ? d : display + d);
  };
  const inputDot = () => {
    if (waitingNew) { setDisplay('0.'); setWaitingNew(false); return; }
    if (!display.includes('.')) setDisplay(display + '.');
  };
  const backspace = () => setDisplay(display.length > 1 ? display.slice(0, -1) : '0');
  const clearAll = () => { setDisplay('0'); setStored(null); setOperator(null); setWaitingNew(false); };
  const clearEntry = () => setDisplay('0');
  const percent = () => setDisplay(String(parseFloat(display || '0') / 100));
  const sqrt = () => setDisplay(String(Math.sqrt(parseFloat(display || '0'))));

  const compute = (a, b, op) => {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '×') return a * b;
    if (op === '÷') return b === 0 ? 0 : a / b;
    return b;
  };

  const chooseOperator = (op) => {
    const current = parseFloat(display || '0');
    if (stored !== null && operator && !waitingNew) {
      const result = compute(stored, current, operator);
      setDisplay(String(result));
      setStored(result);
    } else {
      setStored(current);
    }
    setOperator(op);
    setWaitingNew(true);
  };

  const equals = () => {
    if (operator === null || stored === null) return;
    const current = parseFloat(display || '0');
    const result = compute(stored, current, operator);
    setDisplay(String(result));
    setStored(null);
    setOperator(null);
    setWaitingNew(true);
  };

  const memPlus = () => setMemory(m => m + parseFloat(display || '0'));
  const memMinus = () => setMemory(m => m - parseFloat(display || '0'));
  const memRecall = () => { setDisplay(String(memory)); setWaitingNew(true); };

  if (!open) {
    return (
      <button style={styles.calcFab} onClick={() => setOpen(true)} title="Abrir calculadora">
        <Icon name="Calculator" size={24} color="#0B1F5C" />
      </button>
    );
  }

  return (
    <div style={styles.calcWrap}>
      <div style={styles.calcHeader}>
        <span style={styles.calcHeaderTitle}>
          <Icon name="Calculator" size={13} color="#0B1F5C" style={{ marginRight: 6, verticalAlign: -2 }} />CALCULADORA
        </span>
        <button style={styles.calcCloseBtn} onClick={() => setOpen(false)}><Icon name="X" size={13} color="#5C6D93" /></button>
      </div>
      <div style={styles.calcDisplay}>{display}</div>
      <div style={styles.calcGrid}>
        <button style={styles.calcBtnBlue} onClick={memRecall}>MRC</button>
        <button style={styles.calcBtnPink} onClick={memMinus}>M-</button>
        <button style={styles.calcBtnPink} onClick={memPlus}>M+</button>
        <button style={styles.calcBtnPurple} onClick={sqrt}>√</button>
        <button style={styles.calcBtnBlue} onClick={percent}>%</button>

        <button style={styles.calcBtnGreen} onClick={backspace}>→</button>
        <button style={styles.calcBtnPink} onClick={() => inputDigit('7')}>7</button>
        <button style={styles.calcBtnPink} onClick={() => inputDigit('8')}>8</button>
        <button style={styles.calcBtnPink} onClick={() => inputDigit('9')}>9</button>
        <button style={styles.calcBtnOrange} onClick={() => chooseOperator('÷')}>÷</button>

        <button style={styles.calcBtnBlue} onClick={clearEntry}>CE</button>
        <button style={styles.calcBtnYellow} onClick={() => inputDigit('4')}>4</button>
        <button style={styles.calcBtnYellow} onClick={() => inputDigit('5')}>5</button>
        <button style={styles.calcBtnYellow} onClick={() => inputDigit('6')}>6</button>
        <button style={styles.calcBtnPink} onClick={() => chooseOperator('×')}>×</button>

        <button style={styles.calcBtnOrange} onClick={clearAll}>AC</button>
        <button style={styles.calcBtnYellow} onClick={() => inputDigit('1')}>1</button>
        <button style={styles.calcBtnYellow} onClick={() => inputDigit('2')}>2</button>
        <button style={styles.calcBtnYellow} onClick={() => inputDigit('3')}>3</button>
        <button style={styles.calcBtnPink} onClick={() => chooseOperator('-')}>−</button>

        <button style={styles.calcBtnPink} onClick={() => inputDigit('0')}>0</button>
        <button style={styles.calcBtnPink} onClick={() => inputDigit('00')}>00</button>
        <button style={styles.calcBtnPurple} onClick={inputDot}>.</button>
        <button style={styles.calcBtnPurple} onClick={equals}>=</button>
        <button style={styles.calcBtnPink} onClick={() => chooseOperator('+')}>+</button>
      </div>
    </div>
  );
}
